[tool.pylance]\n# Pylance configuration for the photobooth booking system\n\n# Ignore missing imports for optional dependencies\nreportMissingModuleSource = \"none\"\nreportMissingImports = \"warning\"\n\n# Python path configuration\npythonPath = \".\"\n\n# Include/exclude patterns\ninclude = [\n    \"**/*.py\"\n]\n\nexclude = [\n    \"**/node_modules\",\n    \"**/__pycache__\",\n    \"**/migrations\",\n    \"**/staticfiles\",\n    \"**/media\"\n]\n\n[tool.pyright]\n# Pyright configuration (Pylance is based on Pyright)\n\n# Ignore missing imports for these modules\nreportMissingModuleSource = false\nreportMissingImports = \"warning\"\n\n# Python version\npythonVersion = \"3.8\"\n\n# Virtual environment path (adjust as needed)\n# venvPath = \".\"\n# venv = \"venv\"\n\n# Type checking mode\ntypeCheckingMode = \"basic\"\n\n# Stub path\nstubPath = \"typings\"\n\n# Include/exclude\ninclude = [\n    \"**/*.py\"\n]\n\nexclude = [\n    \"**/node_modules\",\n    \"**/__pycache__\",\n    \"**/migrations\",\n    \"**/staticfiles\",\n    \"**/media\",\n    \"**/venv\",\n    \"**/env\"\n]\n\n[build-system]\nrequires = [\"setuptools>=45\", \"wheel\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"photobooth-booking-system\"\nversion = \"1.0.0\"\ndescription = \"A Django-based photobooth booking system with PostgreSQL database\"\nauthors = [{name = \"Your Name\", email = \"your.email@example.com\"}]\nlicense = {text = \"MIT\"}\nreadme = \"README.md\"\nrequires-python = \">=3.8\"\nclassifiers = [\n    \"Development Status :: 4 - Beta\",\n    \"Intended Audience :: Developers\",\n    \"License :: OSI Approved :: MIT License\",\n    \"Programming Language :: Python :: 3\",\n    \"Programming Language :: Python :: 3.8\",\n    \"Programming Language :: Python :: 3.9\",\n    \"Programming Language :: Python :: 3.10\",\n    \"Programming Language :: Python :: 3.11\",\n    \"Framework :: Django\",\n    \"Topic :: Internet :: WWW/HTTP :: Dynamic Content\",\n]\n\ndependencies = [\n    \"Django>=6.0.3\",\n    \"Pillow>=10.0.0\",\n    \"psycopg2-binary>=2.9.0\",\n    \"python-dotenv>=1.0.0\",\n    \"boto3>=1.26.0\",\n]\n\n[project.optional-dependencies]\ndev = [\n    \"django-extensions>=3.2.0\",\n    \"black>=23.0.0\",\n    \"flake8>=6.0.0\",\n    \"mypy>=1.0.0\",\n]\n\n[project.urls]\nHomepage = \"https://github.com/yourusername/photobooth-booking-system\"\nRepository = \"https://github.com/yourusername/photobooth-booking-system.git\"\nIssues = \"https://github.com/yourusername/photobooth-booking-system/issues\"\n\n[tool.black]\nline-length = 88\ntarget-version = ['py38']\ninclude = '\\.pyi?$'\nextend-exclude = '''\n(\n  /(\n      \\.eggs\n    | \\.git\n    | \\.hg\n    | \\.mypy_cache\n    | \\.tox\n    | \\.venv\n    | _build\n    | buck-out\n    | build\n    | dist\n    | migrations\n  )/\n)\n'''\n\n[tool.isort]\nprofile = \"black\"\nmulti_line_output = 3\nline_length = 88\nknown_django = \"django\"\nknown_first_party = [\"bookings\", \"narrativestudio\"]\nsections = [\"FUTURE\", \"STDLIB\", \"THIRDPARTY\", \"DJANGO\", \"FIRSTPARTY\", \"LOCALFOLDER\"]\n\n[tool.mypy]\npython_version = \"3.8\"\ncheck_untyped_defs = true\nignore_missing_imports = true\nwarn_unused_ignores = true\nwarn_redundant_casts = true\nwarn_unused_configs = true\n\n# Django specific settings\nplugins = [\"mypy_django_plugin.main\"]\n\n[tool.django-stubs]\ndjango_settings_module = \"narrativestudio.settings\"